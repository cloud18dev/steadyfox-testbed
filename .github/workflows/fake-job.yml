name: fake-job

# Started every 15 minutes by the Worker's Cron Trigger (worker/worker.js).
# GitHub's own schedule never fired for this repo.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "success | slow | zero | fail | hang | skip | random (blank = SCENARIO variable)"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ./job.sh
        env:
          SCENARIO: ${{ inputs.scenario || vars.SCENARIO || 'success' }}
          HC_URL: ${{ secrets.HC_URL }}
          CRONITOR_URL: ${{ secrets.CRONITOR_URL }}
          BETTERSTACK_URL: ${{ secrets.BETTERSTACK_URL }}
          HYPERPING_URL: ${{ secrets.HYPERPING_URL }}
